version: '3.8'

services:
  app:
    build: .
    container_name: bun-app-dev
    ports:
      - "6969:8080"
    env_file:
      - .env
    volumes:
      - .:/app
    command: bun run dev
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name: postgres-dev
    restart: always
    env_file:
        - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
